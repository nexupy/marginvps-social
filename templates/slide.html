<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MarginVPS Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050705;
    --bg-raised: #0B100B;
    --hairline: rgba(255,255,255,0.1);
    --green: #12E068;
    --mint: #2CF982;
    --mint-light: #5CFFA1;
    --text: #FFFFFF;
    --text-dim: rgba(255,255,255,0.56);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1350px; overflow:hidden;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", Arial, sans-serif;
    position: relative;
  }
  body::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 88% 6%, rgba(18,224,104,0.14), transparent 55%),
                radial-gradient(circle at 6% 96%, rgba(44,249,130,0.08), transparent 50%);
    pointer-events:none;
  }
  .frame{
    position:relative;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding: 72px 76px;
  }

  /* wordmark */
  .wordmark{
    display:inline-flex; align-items:baseline; gap:1px;
    font-family:"Geist", Arial, sans-serif;
    font-weight:700; font-size:34px; letter-spacing:-0.01em;
  }
  .wordmark .margin{ color:var(--text); }
  .wordmark .vps{ color:var(--mint); }

  /* pillar badge — mirrors the site's latency-pill look */
  .badge{
    display:inline-flex; align-items:center; gap:10px;
    padding: 9px 20px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--badge-color, var(--mint-light)) 45%, transparent);
    background: color-mix(in srgb, var(--badge-color, var(--mint-light)) 10%, transparent);
    font-family:"Geist Mono", monospace;
    font-size: 21px; letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--badge-color, var(--mint-light));
    width: fit-content;
  }
  .badge .dot{ width:8px; height:8px; border-radius:50%; background:var(--badge-color, var(--mint-light)); }

  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; }
  .pager{ font-family:"Geist Mono", monospace; color:var(--text-dim); font-size:24px; }

  .headline{
    font-family:"Geist", Arial, sans-serif;
    font-weight:700;
    font-size: 72px;
    line-height: 1.08;
    letter-spacing:-0.02em;
    color: var(--text);
  }
  .headline .accent{ color: var(--badge-color, var(--mint-light)); }

  .sub{
    font-size: 32px;
    line-height: 1.45;
    color: var(--text-dim);
    max-width: 92%;
    font-weight: 500;
  }

  /* numbered step list */
  .list{ display:flex; flex-direction:column; gap:28px; }
  .list-item{
    display:flex; gap:22px; align-items:flex-start;
    font-size: 34px; line-height:1.4; color: var(--text);
    font-weight: 500;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--hairline);
  }
  .list-item:last-child{ border-bottom: none; }
  .list-item .num{
    font-family:"Geist Mono", monospace;
    color: var(--badge-color, var(--mint-light));
    font-size: 30px; font-weight:500;
    flex-shrink:0; padding-top:4px;
  }

  /* label/value row list — broker latency, feature checklists, comparisons */
  .rows{ display:flex; flex-direction:column; }
  .row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 26px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .row:last-child{ border-bottom:none; }
  .row .label{ font-size: 32px; font-weight:600; color: var(--text); }
  .row .label .meta{ display:block; font-size:22px; color:var(--text-dim); font-weight:500; margin-top:4px; font-family:"Geist Mono", monospace; }
  .row .value{
    font-family:"Geist Mono", monospace;
    font-size: 26px; font-weight:500;
    color: var(--mint-light);
    background: rgba(44,249,130,0.1);
    border: 1px solid rgba(44,249,130,0.35);
    border-radius: 999px;
    padding: 10px 22px;
  }

  /* card grid, dark hairline-bordered card */
  .card{
    background: var(--bg-raised);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 36px 38px;
  }

  /* stat slide */
  .stat-wrap{ display:flex; flex-direction:column; align-items:flex-start; gap:18px; }
  .stat-number{
    font-family:"Geist", Arial, sans-serif;
    font-weight:700;
    font-size: 220px;
    line-height: 0.95;
    color: var(--badge-color, var(--mint-light));
    letter-spacing:-0.02em;
  }
  .stat-label{
    font-size: 36px;
    color: var(--text);
    font-weight:600;
  }
  .stat-context{
    font-size: 28px;
    color: var(--text-dim);
    max-width: 85%;
    font-weight: 500;
  }

  /* testimonial slide */
  .quote-mark{
    font-family:"Geist", Arial, sans-serif;
    font-size: 140px;
    color: var(--badge-color, var(--mint-light));
    line-height: 0.6;
    opacity:0.85;
  }
  .quote-text{
    font-family:"Geist", Arial, sans-serif;
    font-weight:600;
    font-size: 52px;
    line-height: 1.32;
    letter-spacing:-0.01em;
    color: var(--text);
  }
  .attribution{
    display:flex; align-items:center; gap:18px;
    margin-top: 10px;
  }
  .attribution .avatar{
    width:56px; height:56px; border-radius:50%;
    background: linear-gradient(135deg, var(--green), var(--mint));
    display:flex; align-items:center; justify-content:center;
    font-family:"Geist", Arial, sans-serif; font-weight:700; color:#050705; font-size:24px;
  }
  .attribution .name{ font-size:26px; color:var(--text); font-weight:600; }
  .attribution .role{ font-size:22px; color:var(--text-dim); font-weight:500; }

  /* cta slide */
  .cta-wrap{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:26px;
  }
  .cta-tagline{ font-size: 32px; color:var(--text-dim); max-width:80%; font-weight:500; }
  .cta-button{
    margin-top: 10px;
    padding: 22px 48px;
    border-radius: 14px;
    background: var(--green);
    color: #050705;
    font-family:"Geist", Arial, sans-serif;
    font-weight:700; font-size: 30px;
  }
  .cta-url{
    font-family:"Geist Mono", monospace;
    color: var(--mint-light); font-size: 26px; letter-spacing:0.02em;
  }

  .footer-row{ display:flex; justify-content:space-between; align-items:center; }
  .footer-url{ font-family:"Geist Mono", monospace; color:var(--text-dim); font-size:24px; }

  .grow{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:40px; }
  .stack{ display:flex; flex-direction:column; gap:40px; }

  /* myth vs fact: vertical side label + split halves */
  .side-label{
    position:absolute; left:34px; top:50%;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    font-family:"Geist Mono", monospace; font-size:22px; letter-spacing:0.32em;
    color: var(--text-dim); text-transform:uppercase; white-space:nowrap;
  }
  .side-label b{ color: var(--mint-light); font-weight:500; }
  .frame.side{ padding-left:112px; }
  .split{ flex:1; display:flex; flex-direction:column; margin: 36px 0; }
  .split .half{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; }
  .split .myth-half{ padding-bottom:40px; }
  .split .fact-half{ padding-top:40px; border-top: 4px solid var(--green); }
  .tag{
    font-family:"Geist Mono", monospace; font-size:24px; letter-spacing:0.18em;
    width:fit-content; padding:8px 18px; border-radius:8px;
  }
  .tag.myth{ color: rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.22); }
  .tag.fact{ color:#050705; background: var(--green); font-weight:500; }
  .myth-text{
    font-size:54px; line-height:1.15; font-weight:600; letter-spacing:-0.01em;
    color: rgba(255,255,255,0.42);
    text-decoration: line-through; text-decoration-color: rgba(255,90,90,0.75); text-decoration-thickness:5px;
  }
  .fact-text{ font-size:56px; line-height:1.12; font-weight:700; letter-spacing:-0.02em; }
  .fact-text .accent{ color: var(--mint-light); white-space:nowrap; }
  .fact-detail{ font-size:29px; line-height:1.45; color:var(--text-dim); font-weight:500; max-width:95%; }
  .cover-bottom{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:30px; padding-bottom:30px; }

  /* steps: giant outlined numeral */
  .giant-num{
    font-family:"Geist", Arial, sans-serif; font-weight:700;
    color: transparent; -webkit-text-stroke: 4px var(--mint);
    line-height:0.8; letter-spacing:-0.04em;
  }
  .step-cover-num{ font-size:760px; position:absolute; right:40px; top:40px; opacity:0.9; }
  .step-row{ flex:1; display:flex; align-items:center; gap:56px; }
  .step-row .giant-num{ font-size:560px; flex-shrink:0; width:330px; text-align:center; }
  .step-body{ display:flex; flex-direction:column; gap:26px; }
  .step-kicker{ font-family:"Geist Mono", monospace; font-size:24px; letter-spacing:0.2em; color:var(--mint-light); }
  .step-title{ font-size:62px; line-height:1.08; font-weight:700; letter-spacing:-0.02em; }
  .step-desc{ font-size:30px; line-height:1.45; color:var(--text-dim); font-weight:500; }
  .pill{
    font-family:"Geist Mono", monospace; font-size:26px; width:fit-content;
    color: var(--mint-light); background: rgba(44,249,130,0.1);
    border:1px solid rgba(44,249,130,0.35); border-radius:999px; padding:10px 22px;
  }

  /* plans: price sticker + stacked card */
  .price-sticker{
    position:absolute; top:150px; right:84px; transform: rotate(8deg);
    background: var(--green); color:#050705; border-radius:18px;
    padding:22px 30px; text-align:center; box-shadow: 0 18px 50px rgba(18,224,104,0.25);
  }
  .price-sticker .from{ font-family:"Geist Mono", monospace; font-size:22px; letter-spacing:0.1em; }
  .price-sticker .amt{ font-size:58px; font-weight:700; letter-spacing:-0.02em; line-height:1.05; }
  .price-sticker .note{ font-family:"Geist Mono", monospace; font-size:18px; }
  .center-title{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:30px; }
  .center-title .headline{ font-size:96px; }
  .plan-accounts{ display:flex; align-items:baseline; gap:22px; }
  .plan-accounts .n{ font-size:190px; font-weight:700; letter-spacing:-0.03em; color:var(--mint-light); line-height:1; }
  .plan-accounts .t{ font-size:40px; font-weight:600; color:var(--text-dim); }
  .plan-card{
    background: var(--bg-raised); border:1px solid var(--hairline); border-radius:28px;
    padding:52px 50px; display:flex; flex-direction:column; gap:36px;
  }
  .plan-card.featured{ border:2px solid var(--green); box-shadow: 0 0 0 6px rgba(18,224,104,0.08); }
  .plan-head{ display:flex; justify-content:space-between; align-items:center; }
  .plan-name{ font-family:"Geist Mono", monospace; font-size:30px; letter-spacing:0.14em; }
  .plan-flag{ font-family:"Geist Mono", monospace; font-size:20px; letter-spacing:0.12em; color:#050705; background:var(--green); padding:8px 16px; border-radius:999px; }
  .spec-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:18px; }
  .spec{ border:1px solid var(--hairline); border-radius:18px; padding:26px 24px; }
  .spec .k{ font-family:"Geist Mono", monospace; font-size:21px; color:var(--text-dim); letter-spacing:0.1em; }
  .spec .v{ font-size:38px; font-weight:700; margin-top:8px; }
  .plan-price{ display:flex; align-items:baseline; gap:12px; }
  .plan-price .amt{ font-size:128px; font-weight:700; letter-spacing:-0.03em; line-height:1; }
  .plan-price .per{ font-size:38px; color:var(--text-dim); font-weight:600; }
  .plan-fine{ font-family:"Geist Mono", monospace; font-size:24px; color:var(--text-dim); line-height:1.5; }
</style>
</head>
<body>
  <div class="frame" id="frame"></div>
</body>
</html>
